name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install backend
        run: pip install -e "./backend[dev]"
      - name: Lint
        run: ruff check backend/src backend/tests
      - name: Test
        run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: frontend
        # npm/cli#4828: npm won't install rollup's platform-specific optional binary on Linux
        # (persists across npm 10 and 11, with or without the lockfile), so `vite build` crashes
        # with "Cannot find module @rollup/rollup-linux-x64-gnu". The runner is always ubuntu x64,
        # so after the normal install we add that exact binary explicitly — a direct (non-optional)
        # install that npm's optional-dep bug can't skip.
        run: |
          npm ci
          npm install @rollup/rollup-linux-x64-gnu --no-save
      - name: Build
        working-directory: frontend
        run: npm run build
