name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install backend
        run: pip install -e "./backend[dev]"
      - name: Lint
        run: ruff check backend/src backend/tests
      - name: Test
        run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: frontend
        # The npm bundled with the runner (npm 10.x) carries npm/cli#4828: it skips the platform
        # rollup binary on Linux, so `vite build` crashes ("Cannot find module
        # @rollup/rollup-linux-x64-gnu") even after a fresh install. npm 11 fixes the bug — upgrade
        # first, then a clean reproducible install from the lockfile.
        run: |
          npm install -g npm@latest
          npm install
      - name: Build
        working-directory: frontend
        run: npm run build
