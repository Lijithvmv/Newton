[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newton"
version = "0.1.0"
description = "A fully-local, Claude-Code-style coding and project assistant on Ollama."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "aisuite>=0.1.14",
    "pydantic>=2",
    "httpx",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]
# Document intake for binary/office formats. Text formats need nothing; this adds the
# MarkItDown backends for PDF/DOCX/PPTX/XLSX so the core install stays light.
intake = ["markitdown[pdf,docx,pptx,xlsx] >= 0.0.1a2"]

[project.scripts]
newton = "newton.cli:main"                    # interactive task CLI
newton-server = "newton.api.server:main"      # the localhost web API + app
newton-index = "newton.index.cli:main"        # inspect the repo index
newton-project = "newton.project.run:main"    # run the Project Conductor headless
newton-report = "newton.report.run:main"      # read the project → draft a markdown report
newton-intake = "newton.intake.run:main"      # convert any document → indexed markdown
newton-author = "newton.author.run:main"      # draft a PRD / architecture / brainstorm / design doc
newton-wiki = "newton.wiki.cli:main"          # curate & query the project wiki
newton-skill = "newton.skills.cli:main"       # curate & query procedure playbooks (SKILL.md)
newton-eval = "newton.eval.cli:main"          # measure the pipeline vs a naive baseline (the core-bet test)
newton-loop = "newton.loop.cli:main"          # build a feature with the durable decomposition loop (resumable)
newton-fix = "newton.loop.fix_cli:main"       # investigate an open-ended problem & fix it until a check passes
newton-queue = "newton.queue.cli:main"        # run a batch of goals unattended, one at a time (resumable)

[tool.setuptools.packages.find]
where = ["src"]
include = ["newton*"]

[tool.setuptools.package-data]
newton = ["api/static/*", "NEWTON.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Correctness-focused: pyflakes (F), import order (I), pyupgrade (UP), bugbear (B),
# and syntax errors (E9). Whitespace/line-composition style (E1–E7) is left to a formatter.
select = ["E9", "F", "I", "UP", "B"]
ignore = [
    "B008",  # function-call-in-default — intentional for FastAPI `Depends(...)`
    "B905",  # zip() without strict= — not changing zip semantics wholesale
]
